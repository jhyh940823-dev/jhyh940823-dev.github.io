<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaperMemory Legal & Support</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f0e7; color:#302b27; }
    body { margin:0; }
    header { position:sticky; top:0; z-index:2; background:rgba(245,240,231,.96); border-bottom:1px solid #d9d0c3; padding:16px; }
    .wrap { max-width:840px; margin:auto; }
    h1 { margin:0 0 12px; font-size:1.5rem; }
    nav, .languages { display:flex; flex-wrap:wrap; gap:8px; }
    button { border:1px solid #bcae9d; border-radius:999px; padding:9px 13px; background:#fffaf2; color:inherit; cursor:pointer; }
    button[aria-pressed="true"] { background:#6e5d4b; color:white; border-color:#6e5d4b; }
    main { max-width:840px; margin:24px auto 64px; padding:0 16px; }
    article { background:#fffdf8; border:1px solid #ded5c9; border-radius:20px; padding:24px; box-shadow:0 8px 24px rgba(48,43,39,.06); line-height:1.65; }
    article h1, article h2 { line-height:1.3; }
    article h2 { margin-top:1.8em; font-size:1.15rem; }
    article ul { padding-left:1.3em; }
    .status { margin-top:10px; font-size:.9rem; color:#6d6259; }
    .error { color:#a12626; }
    footer { max-width:840px; margin:0 auto 32px; padding:0 16px; color:#6d6259; font-size:.9rem; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>PaperMemory Legal & Support</h1>
    <div class="languages" aria-label="Language">
      <button data-language="ko">한국어</button>
      <button data-language="en">English</button>
      <button data-language="ja">日本語</button>
    </div>
    <nav aria-label="Document" style="margin-top:10px">
      <button data-document="privacy">Privacy</button>
      <button data-document="terms">Terms</button>
      <button data-document="support">Support</button>
      <button data-document="openSource">Licenses</button>
    </nav>
    <div id="status" class="status">Loading…</div>
  </div>
</header>
<main><article id="document" aria-live="polite"></article></main>
<footer>PaperMemory legal and support documents · support.runpet@gmail.com</footer>
<script>
  const source = "../Packages/PaperMemoryModules/Sources/Localization/Resources/LegalDocuments.json";
  const state = {
    language: (navigator.language || "en").toLowerCase().startsWith("ko") ? "ko" : (navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en",
    document: "privacy",
    payload: null
  };
  const escapeHTML = value => value.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  function markdown(text) {
    const lines = text.split("\n");
    let html = "", inList = false;
    for (const raw of lines) {
      const line = escapeHTML(raw);
      if (line.startsWith("# ")) { if (inList) { html += "</ul>"; inList=false; } html += `<h1>${line.slice(2)}</h1>`; }
      else if (line.startsWith("## ")) { if (inList) { html += "</ul>"; inList=false; } html += `<h2>${line.slice(3)}</h2>`; }
      else if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList=true; } html += `<li>${line.slice(2)}</li>`; }
      else if (!line.trim()) { if (inList) { html += "</ul>"; inList=false; } }
      else { if (inList) { html += "</ul>"; inList=false; } html += `<p>${line}</p>`; }
    }
    if (inList) html += "</ul>";
    return html;
  }
  function removeTrailingSection(body, heading) {
    const marker = `\n\n${heading}`;
    const index = body.indexOf(marker);
    return index >= 0 ? body.slice(0, index) : body;
  }
  function contactFooterBody(body, language, documentKind, operatorName, supportEmail) {
    if (documentKind !== "privacy" && documentKind !== "terms") return body;

    let normalized = body;
    let operatorLine;
    let footer;

    if (language === "ko") {
      operatorLine = `운영자: ${operatorName}`;
      if (documentKind === "privacy") {
        normalized = removeTrailingSection(normalized, "## 12. 문의");
      } else {
        normalized = normalized
          .replace("## 10. 준거와 문의", "## 10. 준거")
          .replace(` 문의: ${supportEmail}`, "");
      }
      footer = `## 운영자 및 문의\n\n운영자: ${operatorName}\n\n이메일: ${supportEmail}`;
    } else if (language === "ja") {
      operatorLine = `運営者：${operatorName}`;
      if (documentKind === "privacy") {
        normalized = removeTrailingSection(normalized, "## 12. お問い合わせ");
      } else {
        normalized = normalized
          .replace("## 10. 適用される権利と連絡先", "## 10. 適用される権利")
          .replace(`お問い合わせ：${supportEmail}`, "");
      }
      footer = `## 運営者・お問い合わせ\n\n運営者：${operatorName}\n\nメール：${supportEmail}`;
    } else {
      operatorLine = `Operator: ${operatorName}`;
      if (documentKind === "privacy") {
        normalized = removeTrailingSection(normalized, "## 12. Contact");
      } else {
        normalized = normalized
          .replace("## 10. Applicable rights and contact", "## 10. Applicable rights")
          .replace(` Contact: ${supportEmail}`, "");
      }
      footer = `## Operator and Contact\n\nOperator: ${operatorName}\n\nEmail: ${supportEmail}`;
    }

    normalized = normalized
      .split("\n")
      .filter(line => line.trim() !== operatorLine)
      .join("\n")
      .trim();

    while (normalized.includes("\n\n\n")) {
      normalized = normalized.replaceAll("\n\n\n", "\n\n");
    }

    return `${normalized}\n\n${footer}\n`;
  }
  function render() {
    if (!state.payload) return;
    const activeDocument = state.payload.documents[state.language]?.[state.document] || state.payload.documents.en[state.document];
    const substitutedBody = activeDocument.body
      .replaceAll("{{OPERATOR_NAME}}", state.payload.operatorName)
      .replaceAll("{{SUPPORT_EMAIL}}", state.payload.supportEmail);
    const body = contactFooterBody(
      substitutedBody,
      state.language,
      state.document,
      state.payload.operatorName,
      state.payload.supportEmail
    );
    documentElement.innerHTML = markdown(body);
    window.document.title = `${activeDocument.title} · PaperMemory`;
    statusElement.textContent = `${state.payload.effectiveDate} · ${state.language.toUpperCase()}`;
    window.document.querySelectorAll("button[data-language]").forEach(button => button.setAttribute("aria-pressed", button.dataset.language === state.language));
    window.document.querySelectorAll("button[data-document]").forEach(button => button.setAttribute("aria-pressed", button.dataset.document === state.document));
    history.replaceState(null, "", `?lang=${state.language}&doc=${state.document}`);
    window.document.documentElement.lang = state.language;
  }
  const documentElement = window.document.getElementById("document");
  const statusElement = window.document.getElementById("status");
  const params = new URLSearchParams(location.search);
  if (["ko","en","ja"].includes(params.get("lang"))) state.language = params.get("lang");
  if (["privacy","terms","support","openSource"].includes(params.get("doc"))) state.document = params.get("doc");
  window.document.querySelectorAll("button[data-language]").forEach(button => button.addEventListener("click", () => { state.language = button.dataset.language; render(); }));
  window.document.querySelectorAll("button[data-document]").forEach(button => button.addEventListener("click", () => { state.document = button.dataset.document; render(); }));
  fetch(source, {cache:"no-store"})
    .then(response => { if (!response.ok) throw new Error(`${response.status}`); return response.json(); })
    .then(payload => { state.payload = payload; render(); })
    .catch(error => { statusElement.textContent = "Unable to load legal documents"; statusElement.classList.add("error"); documentElement.textContent = String(error); });
</script>
</body>
</html>
